<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>숲의 여정</title>
<style>
  :root{--bg:#0b0b1e;--fg:#eef;--muted:#9fb3ff}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Malgun Gothic",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
  h1{font-size:15px;margin:10px 0 8px}
  canvas{width:100%;max-width:960px;height:auto;display:block;border-radius:8px;background:#000;touch-action:none}
  .help{font-size:13px;color:var(--muted);margin:8px 16px 16px;text-align:center;line-height:1.7}
</style>
</head>
<body>
<h1>숲의 여정 · 일단 해보자 (프로토타입)</h1>
<canvas id="c" width="960" height="540"></canvas>
<div class="help">← → 이동 · Space 점프 · ↓ + Space 아래로 뛰기 · Z 공격 · X 강타 (레벨 2부터) · S 사과 먹기 · ↑ 포탈 이용<br>목표: 숲에서 레벨을 올리고, 레벨 5가 되면 "뿌리의 심장"의 수호자를 쓰러뜨리자</div>
<script>
const cv = document.getElementById('c')
const ctx = cv.getContext('2d')
const W = 960, H = 540
const GRAV = 1500, MOVE = 230, JUMP = 640, LV_MAX = 10, GROUND = 500

const keys = {}
let pressed = {}

// 몬스터 설정
const MON = {
  mush:  { name: '버섯',   w: 36, h: 36, hp: 22, speed: 50, dmg: 6, exp: 8,  gold: 2, color: '#e35d5d' },
  snail: { name: '달팽이', w: 40, h: 26, hp: 40, speed: 22, dmg: 7, exp: 12, gold: 3, color: '#f0d9a8' },
  bat:   { name: '박쥐',   w: 30, h: 22, hp: 16, speed: 75, dmg: 5, exp: 9,  gold: 2, color: '#7b6cc0', fly: true },
}

// 맵 설정. plats: 발판 (thin이면 아래에서 위로 통과, 아래 점프 가능)
const MAPS = {
  town: {
    name: '푸른 항구 마을', sky: ['#7ec8f0', '#d8f1ff'],
    plats: [
      { x: 0, y: GROUND, w: W, h: 40, thin: false },
      { x: 240, y: 390, w: 170, h: 14, thin: true },
      { x: 560, y: 320, w: 170, h: 14, thin: true },
    ],
    portals: [{ x: 880, y: 440, to: 'forest', arriveX: 60, label: '숲', needLv: 1 }],
    spawns: [],
  },
  forest: {
    name: '속삭이는 숲', sky: ['#2c5a3a', '#7fb37a'],
    plats: [
      { x: 0, y: GROUND, w: W, h: 40, thin: false },
      { x: 90, y: 400, w: 200, h: 14, thin: true },
      { x: 380, y: 330, w: 190, h: 14, thin: true },
      { x: 660, y: 400, w: 200, h: 14, thin: true },
      { x: 400, y: 200, w: 160, h: 14, thin: true },
    ],
    portals: [
      { x: 20, y: 440, to: 'town', arriveX: 840, label: '마을', needLv: 1 },
      { x: 900, y: 440, to: 'boss', arriveX: 60, label: '뿌리의 심장', needLv: 5 },
    ],
    spawns: [
      { plat: 1, types: ['mush', 'snail'] },
      { plat: 2, types: ['bat'] },
      { plat: 3, types: ['mush', 'snail'] },
      { plat: 4, types: ['bat'] },
      { plat: 0, types: ['snail', 'mush'] },
      { plat: 0, types: ['mush'] },
    ],
  },
  boss: {
    name: '뿌리의 심장', sky: ['#2b1a3a', '#5a2d5a'], boss: true,
    plats: [
      { x: 0, y: GROUND, w: W, h: 40, thin: false },
      { x: 300, y: 380, w: 360, h: 14, thin: true },
    ],
    portals: [{ x: 20, y: 440, to: 'forest', arriveX: 840, label: '숲', needLv: 1 }],
    spawns: [],
  },
}

let S = null

function newGame() {
  S = {
    map: 'town', t: 0, deadT: 0, won: false,
    p: {
      x: 300, y: 460, w: 28, h: 40, vx: 0, vy: 0, kbx: 0,
      onGround: false, groundPlat: null, dropUntil: 0,
      facing: 1, hp: 60, maxHp: 60, lv: 1, exp: 0, gold: 0, apples: 3,
      atkCd: 0, atkAnim: 0, skillCd: 0, inv: 0,
    },
    spawns: [], coins: [], texts: [], particles: [], slashes: [],
    boss: null, bossCleared: false,
    notice: '', noticeT: 0, shake: 0,
  }
  enterMap('town', 300)
  say('숲의 여정에 오신 것을 환영합니다!')
}

function say(msg) {
  S.notice = msg
  S.noticeT = 2.4
}

function expNeed(lv) { return lv * 30 }
function atkPower() { return 8 + (S.p.lv - 1) * 2 }

// 맵 이동: 발판마다 몬스터 자리를 만들고 바로 채운다
function enterMap(id, x) {
  const M = MAPS[id]
  S.map = id
  S.coins = []
  S.boss = null
  S.slashes = []
  const p = S.p
  p.x = x
  p.y = GROUND - p.h
  p.vx = 0; p.vy = 0; p.kbx = 0
  p.onGround = true; p.groundPlat = null
  p.inv = 1.0
  S.spawns = M.spawns.map((sp) => ({ ...sp, m: null, timer: 0 }))
  for (const sp of S.spawns) spawnAt(sp)
  if (M.boss && !S.bossCleared) spawnBoss()
  if (M.boss && S.bossCleared) say('뿌리의 심장은 이미 정화되었다.')
  else say(M.name)
}

function spawnAt(sp) {
  const type = sp.types[Math.floor(Math.random() * sp.types.length)]
  const T = MON[type]
  const plat = MAPS[S.map].plats[sp.plat]
  const flyY = plat.y - 110 - Math.random() * 60
  const baseY = T.fly ? flyY : plat.y - T.h
  sp.m = {
    type, T, name: T.name, sp,
    w: T.w, h: T.h, hp: T.hp, maxHp: T.hp,
    x: plat.x + Math.random() * Math.max(0, plat.w - T.w),
    y: baseY, baseY,
    minX: plat.x, maxX: plat.x + plat.w - T.w,
    dir: Math.random() < 0.5 ? -1 : 1,
    t: Math.random() * 6, flash: 0, kx: 0,
  }
}

function spawnBoss() {
  S.boss = {
    isBoss: true, x: 600, y: GROUND - 130, w: 120, h: 130,
    hp: 300, maxHp: 300, vx: 0, vy: 0, onGround: true,
    state: 'chase', t: 0, flash: 0, dead: false,
  }
}

function liveMonsters() {
  return S.spawns.filter((s) => s.m).map((s) => s.m)
}

function targets() {
  const list = liveMonsters()
  if (S.boss && !S.boss.dead) list.push(S.boss)
  return list
}

function overlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y
}

// 효과: 떠오르는 숫자, 파티클, 칼 궤적
function pushText(x, y, str, color) {
  S.texts.push({ x, y, str, color, t: 0 })
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2
    const s = 60 + Math.random() * 160
    S.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: 0.5 + Math.random() * 0.3, color })
  }
}

function updateFx(dt) {
  for (const t of S.texts) { t.t += dt; t.y -= 40 * dt }
  S.texts = S.texts.filter((t) => t.t < 0.9)
  for (const q of S.particles) {
    q.life -= dt
    q.vy += 500 * dt
    q.x += q.vx * dt
    q.y += q.vy * dt
  }
  S.particles = S.particles.filter((q) => q.life > 0)
  for (const s of S.slashes) s.t += dt
  S.slashes = S.slashes.filter((s) => s.t < 0.2)
}

// 플레이어가 맞았을 때
function hurtPlayer(dmg, dir) {
  const p = S.p
  if (p.inv > 0 || S.deadT > 0) return
  p.hp = Math.max(0, p.hp - dmg)
  p.inv = 1.0
  p.kbx = dir * 240
  p.vy = -260
  p.onGround = false
  S.shake = 8
  pushText(p.x + p.w / 2, p.y - 10, '-' + dmg, '#ff6b6b')
  if (p.hp <= 0) {
    S.deadT = 2.5
    say('쓰러졌다… 마을에서 깨어납니다')
  }
}

function gainExp(n) {
  const p = S.p
  p.exp += n
  pushText(p.x + p.w / 2, p.y - 26, `EXP +${n}`, '#9ef0ff')
  while (p.lv < LV_MAX && p.exp >= expNeed(p.lv)) {
    p.exp -= expNeed(p.lv)
    p.lv += 1
    p.maxHp += 15
    p.hp = p.maxHp
    say(`레벨 업! Lv ${p.lv}`)
    burst(p.x + p.w / 2, p.y, '#ffe066', 22)
  }
}

function hitMonster(m, dmg, dir) {
  m.hp -= dmg
  m.flash = 0.12
  pushText(m.x + m.w / 2, m.y - 6, String(dmg), '#ffe066')
  if (!m.isBoss) m.kx = dir * 140
  if (m.hp <= 0) killMonster(m)
}

function killMonster(m) {
  const cx = m.x + m.w / 2, cy = m.y + m.h / 2
  if (m.isBoss) {
    m.dead = true
    S.bossCleared = true
    S.won = true
    S.shake = 16
    burst(cx, cy, '#9be36a', 40)
    gainExp(150)
    say('뿌리의 수호자를 쓰러뜨렸다! 숲의 여정 1막 완료')
    return
  }
  const sp = m.sp
  sp.m = null
  sp.timer = 6
  gainExp(m.T.exp)
  for (let i = 0; i < m.T.gold; i++) {
    S.coins.push({ kind: 'gold', v: 1, x: cx + (Math.random() - 0.5) * 24, y: cy, t: 0, life: 12 })
  }
  if (Math.random() < 0.15) {
    S.coins.push({ kind: 'apple', v: 1, x: cx, y: cy, t: 0, life: 12 })
  }
  burst(cx, cy, m.T.color, 14)
  S.shake = Math.max(S.shake, 3)
}

// 공격 판정: 상자 안에 든 적 전부에게 피해
function attackBox(box, dmg, dir) {
  for (const m of targets()) {
    if (overlap(box, m)) hitMonster(m, dmg, dir)
  }
}

function updatePlayer(dt) {
  const p = S.p
  const left = keys.ArrowLeft || keys.KeyA
  const right = keys.ArrowRight || keys.KeyD
  const move = ((right ? 1 : 0) - (left ? 1 : 0)) * MOVE
  if (move) p.facing = Math.sign(move)

  // 점프 / 아래로 뛰기
  if (pressed.Space && p.onGround) {
    if (keys.ArrowDown && p.groundPlat && p.groundPlat.thin) {
      p.dropUntil = S.t + 0.35
      p.onGround = false
      p.vy = 120
    } else {
      p.vy = -JUMP
      p.onGround = false
    }
  }

  p.vx = move + p.kbx
  p.kbx *= Math.pow(0.02, dt)
  if (Math.abs(p.kbx) < 1) p.kbx = 0

  p.vy += GRAV * dt
  const oldBottom = p.y + p.h
  p.x = Math.min(W - p.w, Math.max(0, p.x + p.vx * dt))
  p.y += p.vy * dt

  // 발판 착지 (위에서 떨어질 때만)
  p.onGround = false
  if (p.vy >= 0) {
    for (const pl of MAPS[S.map].plats) {
      const newBottom = p.y + p.h
      const within = p.x + p.w > pl.x + 2 && p.x < pl.x + pl.w - 2
      if (within && oldBottom <= pl.y + 2 && newBottom >= pl.y) {
        if (pl.thin && p.dropUntil > S.t) continue
        p.y = pl.y - p.h
        p.vy = 0
        p.onGround = true
        p.groundPlat = pl
        break
      }
    }
  }
  if (p.vy < 0 || !p.onGround) {
    // 공중에 있는 동안 발판 정보는 지운다
    if (!p.onGround) p.groundPlat = null
  }
}

function updateMonsters(dt) {
  for (const sp of S.spawns) {
    if (!sp.m) {
      sp.timer -= dt
      if (sp.timer <= 0) spawnAt(sp)
      continue
    }
    const m = sp.m
    m.t += dt
    m.flash = Math.max(0, m.flash - dt)
    m.kx *= Math.pow(0.001, dt)
    m.x += (m.dir * m.T.speed + m.kx) * dt
    if (m.x <= m.minX) { m.x = m.minX; m.dir = 1 }
    if (m.x >= m.maxX) { m.x = m.maxX; m.dir = -1 }
    if (m.T.fly) m.y = m.baseY + Math.sin(m.t * 3) * 18
    if (overlap(S.p, m)) hurtPlayer(m.T.dmg, Math.sign(S.p.x + S.p.w / 2 - (m.x + m.w / 2)) || 1)
  }
}

// 보스: 쫓아가기 → 점프 → 착지하면 충격파
function updateBoss(dt) {
  const b = S.boss
  if (!b || b.dead) return
  const p = S.p
  b.t += dt
  b.flash = Math.max(0, b.flash - dt)
  const bcx = b.x + b.w / 2
  const pcx = p.x + p.w / 2

  if (b.state === 'chase') {
    b.vx = Math.sign(pcx - bcx || 1) * 85
    if (b.t > 2.2 && b.onGround) {
      b.state = 'jump'
      b.t = 0
      b.vx = 0
      b.vy = -620
      b.onGround = false
    }
  }

  const wasAir = !b.onGround
  b.vy += GRAV * dt
  b.x = Math.min(W - b.w, Math.max(0, b.x + b.vx * dt))
  b.y += b.vy * dt
  const floor = GROUND - b.h
  if (b.y >= floor && b.vy >= 0) {
    b.y = floor
    b.vy = 0
    b.onGround = true
    if (wasAir && b.state === 'jump') {
      b.state = 'chase'
      b.t = 0
      S.shake = 14
      burst(bcx, GROUND, '#c08a5a', 18)
      if (Math.abs(pcx - bcx) < 220 && p.onGround) hurtPlayer(14, Math.sign(pcx - bcx) || 1)
    }
  }

  if (overlap(p, b)) hurtPlayer(10, Math.sign(pcx - bcx) || 1)
}

function updateItems(dt) {
  const p = S.p
  for (const c of S.coins) {
    c.t += dt
    c.life -= dt
    if (Math.hypot(p.x + p.w / 2 - c.x, p.y + p.h / 2 - c.y) < 36) {
      c.collected = true
      if (c.kind === 'gold') {
        p.gold += c.v
        pushText(c.x, c.y - 8, '+1 골드', '#ffd447')
      } else {
        p.apples += 1
        pushText(c.x, c.y - 8, '사과 +1', '#9be36a')
      }
    }
  }
  S.coins = S.coins.filter((c) => !c.collected && c.life > 0)
}

function update(dt) {
  S.t += dt
  S.shake *= Math.pow(0.001, dt)
  if (S.shake < 0.2) S.shake = 0
  S.noticeT = Math.max(0, S.noticeT - dt)
  updateFx(dt)

  // 쓰러졌을 때: 잠깐 기다렸다가 마을에서 다시 시작
  if (S.deadT > 0) {
    S.deadT -= dt
    if (S.deadT <= 0) {
      S.p.hp = Math.floor(S.p.maxHp / 2)
      enterMap('town', 300)
    }
    pressed = {}
    return
  }

  const p = S.p
  p.atkCd = Math.max(0, p.atkCd - dt)
  p.skillCd = Math.max(0, p.skillCd - dt)
  p.atkAnim = Math.max(0, p.atkAnim - dt)
  p.inv = Math.max(0, p.inv - dt)

  // 공격 Z
  if (pressed.KeyZ && p.atkCd <= 0) {
    p.atkCd = 0.35
    p.atkAnim = 0.15
    S.slashes.push({ x: p.x + p.w / 2 + p.facing * 22, y: p.y + p.h / 2, dir: p.facing, t: 0, big: false })
    attackBox({ x: p.facing > 0 ? p.x + p.w : p.x - 42, y: p.y - 6, w: 42, h: p.h + 12 }, atkPower(), p.facing)
  }

  // 강타 X (레벨 2부터)
  if (pressed.KeyX) {
    if (p.lv < 2) say('강타는 레벨 2부터 쓸 수 있어요')
    else if (p.skillCd > 0) say(`강타 준비 중… ${Math.ceil(p.skillCd)}초`)
    else {
      p.skillCd = 4
      p.atkAnim = 0.25
      S.shake = Math.max(S.shake, 6)
      S.slashes.push({ x: p.x + p.w / 2 + p.facing * 30, y: p.y + p.h / 2, dir: p.facing, t: 0, big: true })
      attackBox({ x: p.facing > 0 ? p.x + p.w : p.x - 70, y: p.y - 14, w: 70, h: p.h + 28 }, atkPower() * 2, p.facing)
    }
  }

  // 사과 S
  if (pressed.KeyS) {
    if (p.apples <= 0) say('사과가 없어요')
    else if (p.hp >= p.maxHp) say('체력이 가득 찼어요')
    else {
      p.apples -= 1
      const before = p.hp
      p.hp = Math.min(p.maxHp, p.hp + 30)
      pushText(p.x + p.w / 2, p.y - 10, `+${p.hp - before}`, '#9be36a')
    }
  }

  updatePlayer(dt)
  updateMonsters(dt)
  updateBoss(dt)
  updateItems(dt)

  // 포탈 ↑
  if (pressed.ArrowUp || pressed.KeyW) {
    const M = MAPS[S.map]
    for (const pt of M.portals) {
      const near = overlap(p, { x: pt.x - 10, y: pt.y - 10, w: 60, h: 70 })
      if (!near) continue
      if (p.lv < pt.needLv) {
        say(`레벨 ${pt.needLv} 이상이어야 들어갈 수 있어요`)
      } else {
        enterMap(pt.to, pt.arriveX)
      }
      break
    }
  }

  pressed = {}
}

// ---------- 그리기 ----------
function drawDeco(M) {
  if (S.map === 'town') {
    for (let i = 0; i < 6; i++) {
      const x = 40 + i * 160
      ctx.fillStyle = '#e8c9a0'
      ctx.fillRect(x, 330, 90, 170)
      ctx.fillStyle = '#c0644a'
      ctx.beginPath(); ctx.moveTo(x - 10, 330); ctx.lineTo(x + 45, 280); ctx.lineTo(x + 100, 330); ctx.fill()
      ctx.fillStyle = '#5b8bc0'
      ctx.fillRect(x + 35, 380, 22, 30)
    }
  } else if (S.map === 'forest') {
    for (let i = 0; i < 7; i++) {
      const x = 30 + i * 150
      ctx.fillStyle = '#4a3320'
      ctx.fillRect(x + 36, 300, 16, 200)
      ctx.fillStyle = '#2f6b3a'
      ctx.beginPath(); ctx.arc(x + 44, 290, 46, 0, Math.PI * 2); ctx.fill()
      ctx.fillStyle = '#3f8a4a'
      ctx.beginPath(); ctx.arc(x + 30, 270, 30, 0, Math.PI * 2); ctx.fill()
    }
  } else {
    for (let i = 0; i < 4; i++) {
      const x = 80 + i * 240
      ctx.fillStyle = 'rgba(120,60,120,0.35)'
      ctx.fillRect(x, 120, 30, 380)
      ctx.beginPath(); ctx.arc(x + 15, 110, 26, 0, Math.PI * 2); ctx.fill()
    }
  }
}

function drawPlat(pl, M) {
  if (pl.y >= GROUND) {
    ctx.fillStyle = M.sky[1] === '#d8f1ff' ? '#8a6a4a' : (S.map === 'forest' ? '#5a4128' : '#3b2b3b')
    ctx.fillRect(pl.x, pl.y, pl.w, pl.h)
    ctx.fillStyle = S.map === 'forest' ? '#4f9a4a' : (S.map === 'town' ? '#7fbf5a' : '#6a4a6a')
    ctx.fillRect(pl.x, pl.y, pl.w, 8)
  } else {
    ctx.fillStyle = S.map === 'forest' ? '#6b4f2a' : '#6a4a6a'
    ctx.fillRect(pl.x, pl.y, pl.w, pl.h)
    ctx.fillStyle = S.map === 'forest' ? '#4f9a4a' : '#9a6ab0'
    ctx.fillRect(pl.x, pl.y, pl.w, 5)
  }
}

function drawPortal(pt) {
  const cx = pt.x + 20, cy = pt.y + 30
  const pulse = 0.5 + Math.sin(S.t * 4) * 0.2
  ctx.fillStyle = `rgba(160,220,255,${pulse})`
  ctx.beginPath(); ctx.ellipse(cx, cy, 24, 34, 0, 0, Math.PI * 2); ctx.fill()
  ctx.fillStyle = '#e6f6ff'
  ctx.beginPath(); ctx.ellipse(cx, cy, 14, 24, 0, 0, Math.PI * 2); ctx.fill()
  ctx.fillStyle = '#eef'
  ctx.font = 'bold 13px sans-serif'
  ctx.textAlign = 'center'
  ctx.fillText(pt.label, cx, pt.y - 8)
  ctx.textAlign = 'left'
}

function drawItem(c) {
  const bob = Math.sin(S.t * 5 + c.x) * 3
  if (c.kind === 'gold') {
    ctx.fillStyle = '#ffd447'
    ctx.beginPath(); ctx.arc(c.x, c.y + bob, 7, 0, Math.PI * 2); ctx.fill()
    ctx.strokeStyle = '#8a6a00'; ctx.lineWidth = 2; ctx.stroke()
  } else {
    ctx.fillStyle = '#e35d5d'
    ctx.beginPath(); ctx.arc(c.x, c.y + bob, 9, 0, Math.PI * 2); ctx.fill()
    ctx.fillStyle = '#9be36a'
    ctx.fillRect(c.x - 1, c.y + bob - 12, 3, 6)
  }
}

function drawMonster(m) {
  const white = m.flash > 0
  const x = m.x, y = m.y
  ctx.save()
  if (m.type === 'mush') {
    ctx.fillStyle = white ? '#fff' : '#f2e6c9'
    ctx.fillRect(x + m.w * 0.3, y + m.h * 0.5, m.w * 0.4, m.h * 0.5)
    ctx.fillStyle = white ? '#fff' : m.T.color
    ctx.beginPath(); ctx.ellipse(x + m.w / 2, y + m.h * 0.5, m.w / 2, m.h * 0.5, 0, Math.PI, 0); ctx.fill()
    ctx.fillStyle = '#fff'
    ctx.beginPath(); ctx.arc(x + m.w * 0.3, y + m.h * 0.42, 3, 0, Math.PI * 2); ctx.fill()
    ctx.beginPath(); ctx.arc(x + m.w * 0.7, y + m.h * 0.42, 3, 0, Math.PI * 2); ctx.fill()
    ctx.fillStyle = '#222'
    ctx.fillRect(x + m.w * 0.36, y + m.h * 0.72, 3, 4)
    ctx.fillRect(x + m.w * 0.6, y + m.h * 0.72, 3, 4)
  } else if (m.type === 'snail') {
    ctx.fillStyle = white ? '#fff' : '#e8cf96'
    ctx.fillRect(x, y + m.h * 0.5, m.w, m.h * 0.5)
    ctx.fillStyle = white ? '#fff' : '#9b6b3c'
    ctx.beginPath(); ctx.arc(x + m.w * 0.55, y + m.h * 0.42, m.h * 0.45, 0, Math.PI * 2); ctx.fill()
    ctx.strokeStyle = '#6b4620'; ctx.lineWidth = 2
    ctx.beginPath(); ctx.arc(x + m.w * 0.55, y + m.h * 0.42, m.h * 0.22, 0, Math.PI * 1.7); ctx.stroke()
  } else {
    const flap = Math.sin(m.t * 12) * 6
    ctx.fillStyle = white ? '#fff' : m.T.color
    ctx.beginPath()
    ctx.moveTo(x, y + m.h / 2)
    ctx.lineTo(x + m.w * 0.2, y + m.h * 0.2 + flap)
    ctx.lineTo(x + m.w * 0.4, y + m.h / 2)
    ctx.lineTo(x + m.w * 0.6, y + m.h * 0.2 + flap)
    ctx.lineTo(x + m.w, y + m.h / 2)
    ctx.lineTo(x + m.w / 2, y + m.h)
    ctx.fill()
    ctx.fillStyle = '#fff'
    ctx.beginPath(); ctx.arc(x + m.w * 0.4, y + m.h * 0.45, 2, 0, Math.PI * 2); ctx.fill()
    ctx.beginPath(); ctx.arc(x + m.w * 0.6, y + m.h * 0.45, 2, 0, Math.PI * 2); ctx.fill()
  }
  ctx.restore()
  if (m.hp < m.maxHp) hpBar(x, y - 8, m.w, m.hp, m.maxHp)
}

function drawBoss(b) {
  const white = b.flash > 0
  const x = b.x, y = b.y
  ctx.fillStyle = white ? '#fff' : '#6d4a2b'
  ctx.fillRect(x + b.w * 0.35, y + b.h * 0.4, b.w * 0.3, b.h * 0.6)
  ctx.fillStyle = white ? '#fff' : '#2f6b3a'
  ctx.beginPath(); ctx.ellipse(x + b.w / 2, y + b.h * 0.35, b.w * 0.5, b.h * 0.38, 0, 0, Math.PI * 2); ctx.fill()
  ctx.fillStyle = '#ffe066'
  ctx.beginPath(); ctx.arc(x + b.w * 0.36, y + b.h * 0.32, 6, 0, Math.PI * 2); ctx.fill()
  ctx.beginPath(); ctx.arc(x + b.w * 0.64, y + b.h * 0.32, 6, 0, Math.PI * 2); ctx.fill()
  ctx.fillStyle = '#1a1a1a'
  ctx.fillRect(x + b.w * 0.34, y + b.h * 0.3, 4, 4)
  ctx.fillRect(x + b.w * 0.62, y + b.h * 0.3, 4, 4)
}

function hpBar(x, y, w, hp, max) {
  ctx.fillStyle = '#333'
  ctx.fillRect(x, y, w, 5)
  ctx.fillStyle = '#4cd964'
  ctx.fillRect(x, y, w * Math.max(0, hp / max), 5)
}

function drawPlayer(p) {
  if (p.inv > 0 && Math.floor(S.t * 15) % 2 === 0) return
  const x = p.x, y = p.y
  ctx.fillStyle = '#3a7bd5'
  ctx.fillRect(x + 4, y + 16, p.w - 8, p.h - 16)
  ctx.fillStyle = '#ffd9b3'
  ctx.beginPath(); ctx.arc(x + p.w / 2, y + 10, 10, 0, Math.PI * 2); ctx.fill()
  ctx.fillStyle = '#3a2a1a'
  ctx.fillRect(x + 4, y + 2, p.w - 8, 5)
  ctx.fillStyle = '#222'
  ctx.fillRect(x + p.w / 2 + p.facing * 3, y + 9, 2, 3)
  // 검
  const hx = x + p.w / 2 + p.facing * 8, hy = y + 24
  ctx.strokeStyle = '#dfe6ee'; ctx.lineWidth = 4
  ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx + p.facing * 22, hy - 16); ctx.stroke()
  ctx.strokeStyle = '#c0a060'; ctx.lineWidth = 3
  ctx.beginPath(); ctx.moveTo(hx - 4, hy + 4); ctx.lineTo(hx + 4, hy - 4); ctx.stroke()
}

function drawSlashes() {
  for (const s of S.slashes) {
    const k = s.t / 0.2
    const r = s.big ? 58 : 36
    ctx.save()
    ctx.globalAlpha = 1 - k
    ctx.strokeStyle = s.big ? '#ffe066' : '#eef'
    ctx.lineWidth = s.big ? 8 : 5
    ctx.beginPath()
    if (s.dir > 0) ctx.arc(s.x - 14, s.y, r, -1.0, 1.0)
    else ctx.arc(s.x + 14, s.y, r, Math.PI - 1.0, Math.PI + 1.0)
    ctx.stroke()
    ctx.restore()
  }
}

function drawHud() {
  const p = S.p
  // 왼쪽 위 상태판
  ctx.fillStyle = 'rgba(0,0,0,0.55)'
  roundRect(10, 10, 270, 96, 8)
  ctx.fillStyle = '#fff'
  ctx.font = 'bold 15px sans-serif'
  ctx.textBaseline = 'top'
  ctx.fillText(`Lv ${p.lv}`, 22, 18)
  ctx.font = '13px sans-serif'
  ctx.fillText(`HP ${p.hp} / ${p.maxHp}`, 90, 20)
  ctx.fillStyle = '#333'; ctx.fillRect(22, 40, 250, 12)
  ctx.fillStyle = '#e35d5d'; ctx.fillRect(22, 40, 250 * Math.max(0, p.hp / p.maxHp), 12)
  ctx.fillStyle = '#333'; ctx.fillRect(22, 58, 250, 8)
  ctx.fillStyle = '#5ab0ff'
  const need = expNeed(p.lv)
  ctx.fillRect(22, 58, 250 * (p.lv >= LV_MAX ? 1 : p.exp / need), 8)
  ctx.fillStyle = '#fff'
  ctx.font = '13px sans-serif'
  ctx.fillText(p.lv >= LV_MAX ? 'EXP 최대' : `EXP ${p.exp} / ${need}`, 22, 70)
  ctx.fillText(`골드 ${p.gold}   사과 ${p.apples} (S)`, 22, 88)

  // 오른쪽 위 지역 이름
  const name = MAPS[S.map].name
  ctx.fillStyle = 'rgba(0,0,0,0.55)'
  ctx.font = 'bold 15px sans-serif'
  const tw = ctx.measureText(name).width
  roundRect(W - tw - 40, 10, tw + 30, 34, 8)
  ctx.fillStyle = '#fff'
  ctx.textAlign = 'right'
  ctx.fillText(name, W - 22, 18)
  ctx.textAlign = 'left'

  // 아래 스킬 상태
  const sk = p.lv < 2 ? '잠김 (Lv 2)' : (p.skillCd > 0 ? `${Math.ceil(p.skillCd)}초` : '준비됨')
  ctx.fillStyle = 'rgba(0,0,0,0.55)'
  roundRect(10, H - 46, 300, 36, 8)
  ctx.fillStyle = '#fff'
  ctx.font = '13px sans-serif'
  ctx.fillText(`Z 공격   X 강타: ${sk}`, 22, H - 36)

  // 보스 체력
  if (S.boss && !S.boss.dead) {
    const bw = 420
    ctx.fillStyle = 'rgba(0,0,0,0.55)'
    roundRect(W / 2 - bw / 2 - 10, 46, bw + 20, 34, 8)
    ctx.fillStyle = '#fff'
    ctx.font = 'bold 13px sans-serif'
    ctx.textAlign = 'center'
    ctx.fillText(`뿌리의 수호자  ${S.boss.hp} / ${S.boss.maxHp}`, W / 2, 52)
    ctx.fillStyle = '#333'; ctx.fillRect(W / 2 - bw / 2, 68, bw, 8)
    ctx.fillStyle = '#c05ae0'; ctx.fillRect(W / 2 - bw / 2, 68, bw * Math.max(0, S.boss.hp / S.boss.maxHp), 8)
    ctx.textAlign = 'left'
  }

  // 알림
  if (S.noticeT > 0 && S.notice) {
    ctx.save()
    ctx.globalAlpha = Math.min(1, S.noticeT)
    ctx.font = 'bold 20px sans-serif'
    ctx.textAlign = 'center'
    ctx.fillStyle = 'rgba(0,0,0,0.6)'
    const nw = ctx.measureText(S.notice).width
    roundRect(W / 2 - nw / 2 - 16, 120, nw + 32, 40, 8)
    ctx.fillStyle = '#fff'
    ctx.fillText(S.notice, W / 2, 128)
    ctx.restore()
    ctx.textAlign = 'left'
  }
  ctx.textBaseline = 'alphabetic'
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath()
  ctx.moveTo(x + r, y)
  ctx.arcTo(x + w, y, x + w, y + h, r)
  ctx.arcTo(x + w, y + h, x, y + h, r)
  ctx.arcTo(x, y + h, x, y, r)
  ctx.arcTo(x, y, x + w, y, r)
  ctx.closePath()
  ctx.fill()
}

function draw() {
  ctx.save()
  if (S.shake > 0.3) ctx.translate((Math.random() - 0.5) * S.shake, (Math.random() - 0.5) * S.shake)
  const M = MAPS[S.map]
  const g = ctx.createLinearGradient(0, 0, 0, H)
  g.addColorStop(0, M.sky[0])
  g.addColorStop(1, M.sky[1])
  ctx.fillStyle = g
  ctx.fillRect(0, 0, W, H)
  drawDeco(M)
  for (const pl of M.plats) drawPlat(pl, M)
  for (const pt of M.portals) drawPortal(pt)
  for (const c of S.coins) drawItem(c)
  for (const m of liveMonsters()) drawMonster(m)
  if (S.boss && !S.boss.dead) drawBoss(S.boss)
  drawPlayer(S.p)
  drawSlashes()
  for (const q of S.particles) {
    ctx.globalAlpha = Math.max(0, q.life * 2)
    ctx.fillStyle = q.color
    ctx.fillRect(q.x, q.y, 4, 4)
  }
  ctx.globalAlpha = 1
  ctx.font = 'bold 16px sans-serif'
  for (const t of S.texts) {
    ctx.globalAlpha = Math.max(0, 1 - t.t / 0.9)
    ctx.fillStyle = t.color
    ctx.textAlign = 'center'
    ctx.fillText(t.str, t.x, t.y)
  }
  ctx.globalAlpha = 1
  ctx.textAlign = 'left'
  ctx.restore()

  drawHud()

  if (S.deadT > 0) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)'
    ctx.fillRect(0, 0, W, H)
    ctx.fillStyle = '#fff'
    ctx.font = 'bold 26px sans-serif'
    ctx.textAlign = 'center'
    ctx.fillText('쓰러졌다…', W / 2, H / 2 - 10)
    ctx.font = '15px sans-serif'
    ctx.fillText('마을에서 다시 깨어납니다', W / 2, H / 2 + 20)
    ctx.textAlign = 'left'
  }
  if (S.won) {
    ctx.fillStyle = 'rgba(0,0,0,0.45)'
    ctx.fillRect(0, H / 2 - 60, W, 120)
    ctx.fillStyle = '#ffe066'
    ctx.font = 'bold 28px sans-serif'
    ctx.textAlign = 'center'
    ctx.fillText('숲의 여정 1막 완료!', W / 2, H / 2 - 16)
    ctx.fillStyle = '#fff'
    ctx.font = '15px sans-serif'
    ctx.fillText('숲과 마을을 자유롭게 돌아다니며 계속 레벨을 올려 보세요', W / 2, H / 2 + 20)
    ctx.textAlign = 'left'
  }
}

// ---------- 입력 ----------
const CTRL = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space', 'KeyA', 'KeyD', 'KeyW', 'KeyS', 'KeyZ', 'KeyX']
window.addEventListener('keydown', (e) => {
  if (CTRL.includes(e.code)) e.preventDefault()
  if (!keys[e.code]) pressed[e.code] = true
  keys[e.code] = true
})
window.addEventListener('keyup', (e) => { keys[e.code] = false })
window.addEventListener('blur', () => { for (const k of Object.keys(keys)) keys[k] = false })

// ---------- 시작 ----------
newGame()
let last = performance.now()
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000)
  last = now
  update(dt)
  draw()
  requestAnimationFrame(frame)
}
requestAnimationFrame(frame)
</script>
</body>
</html>
