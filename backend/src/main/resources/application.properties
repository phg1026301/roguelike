spring.application.name=backend
spring.config.import=optional:classpath:application-secret.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/roguelike?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=${PORT:8080}

# 카카오 로그인 (로컬은 application-secret.properties, 배포는 Render 환경 변수)
kakao.client-id=${KAKAO_CLIENT_ID:}
kakao.client-secret=${KAKAO_CLIENT_SECRET:}
# 로그인 토큰 서명 키 (배포 시 Render에서 긴 랜덤 문자열로 설정)
jwt.secret=${JWT_SECRET:local-dev-secret-change-me-0123456789}
